<!DOCTYPE html>
<html>
<head>
<title>Movie Ticket Booking Form</title>
<style>
body{
    font-family: Arial;
    background:#f4f4f4;
}
form{
    width: 400px;
    margin: 30px auto;
    padding: 20px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}
input,select{
    width:100%;
    padding:8px;
    margin:8px 0;
}
button{
    width:100%;
    padding:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
}
.error{
    color:red;
}
</style>
</head>
<body>

<h2 style="text-align:center;">Movie Ticket Booking Form</h2>

<form id="movieForm">
    <label>Name:</label>
    <input type="text" id="name">

    <label>Email:</label>
    <input type="email" id="email">

    <label>Phone:</label>
    <input type="text" id="phone">

    <label>Movie Name:</label>
    <select id="movie">
        <option value="">Select</option>
        <option>Avengers</option>
        <option>KGF</option>
        <option>Leo</option>
    </select>

    <label>Show Time:</label>
    <select id="time">
        <option value="">Select</option>
        <option>10:00 AM</option>
        <option>2:00 PM</option>
        <option>6:00 PM</option>
    </select>

    <label>No. of Tickets:</label>
    <input type="number" id="tickets">

    <label>Date:</label>
    <input type="date" id="date">

    <p class="error" id="err"></p>
    <button type="button" onclick="validateMovie()">Book Ticket</button>
</form>

<script>
function validateMovie(){
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let movie = document.getElementById("movie").value;
    let time = document.getElementById("time").value;
    let tickets = document.getElementById("tickets").value;
    let date = document.getElementById("date").value;
    let err = document.getElementById("err");

    if(name=="" || email=="" || phone=="" || movie=="" || time=="" || tickets=="" || date==""){
        alert("All fields are required!");
        return;
    }
    if(tickets <= 0){
        alert("Tickets must be at least 1");
        return;
    }

    err.innerHTML = "Ticket Booked Successfully!";
    err.style.color="green";

    // PRINT DETAILS IN CONSOLE
    console.log("----- MOVIE TICKET BOOKING DETAILS -----");
    console.log("Name: " + name);
    console.log("Email: " + email);
    console.log("Phone: " + phone);
    console.log("Movie: " + movie);
    console.log("Show Time: " + time);
    console.log("Tickets: " + tickets);
    console.log("Date: " + date);
    console.log("----------------------------------------");
}
</script>

</body>
</html>
