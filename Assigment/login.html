<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Job Application Login</title>
        <style>
            body {
                font-family: 'Arial', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                color: #333;
            }
            .container {
                background: white;
                border-radius: 10px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
                padding: 40px;
                width: 100%;
                max-width: 400px;
                text-align: center;
            }
            h1 {
                margin-bottom: 30px;
                color: #333;
                font-size: 2em;
            }
            form {
                display: flex;
                flex-direction: column;
            }
            label {
                margin-bottom: 5px;
                font-weight: bold;
                text-align: left;
            }
            input[type="text"], input[type="password"], input[type="tel"], input[type="number"], input[type="date"], select {
                padding: 12px;
                margin-bottom: 20px;
                border: 1px solid #ddd;
                border-radius: 5px;
                font-size: 16px;
                transition: border-color 0.3s;
            }
            input[type="text"]:focus, input[type="password"]:focus, input[type="tel"]:focus, input[type="number"]:focus, input[type="date"]:focus, select:focus {
                border-color: #667eea;
                outline: none;
            }
            input[type="submit"] {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                padding: 15px;
                border-radius: 5px;
                font-size: 18px;
                cursor: pointer;
                transition: background 0.3s;
            }
            input[type="submit"]:hover {
                background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Job Application Login</h1>
            <form onsubmit="myfunc(event)">
                <label for="name">Full Name:</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
                <label for="email">Email:</label>
                <input type="text" id="email" placeholder="Enter your email" required>
                <label for="pass">Password:</label>
                <input type="password" id="pass" placeholder="Enter your password" required>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
                <label for="age">Age:</label>
                <input type="number" id="age" placeholder="Enter your age" required>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" required>
                <label for="gender">Gender:</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <label for="address">Address:</label>
                <input type="text" id="address" placeholder="Enter your address" required>
                <input type="submit" value="Login">
            </form>
        </div>
        <script>
            function myfunc(e){
                e.preventDefault();
                let name = document.getElementById("name").value;
                let email = document.getElementById("email").value;
                let pass = document.getElementById("pass").value;
                let phone = document.getElementById("phone").value;
                let age = document.getElementById("age").value;
                let dob = document.getElementById("dob").value;
                let gender = document.getElementById("gender").value;
                let address = document.getElementById("address").value;

                console.log(`Name: ${name}, Email: ${email}, Password: ${pass}, Phone: ${phone}, Age: ${age}, DOB: ${dob}, Gender: ${gender}, Address: ${address}`);

                // Clear all fields
                document.getElementById("name").value = "";
                document.getElementById("email").value = "";
                document.getElementById("pass").value = "";
                document.getElementById("phone").value = "";
                document.getElementById("age").value = "";
                document.getElementById("dob").value = "";
                document.getElementById("gender").value = "";
                document.getElementById("address").value = "";

                // Validation (Evaluation)
                if(name === "" || email === "" || pass === "" || phone === "" || age === "" || dob === "" || gender === "" || address === ""){
                    alert("Please fill all details");
                    return;
                }
                if(!/^\d+$/.test(phone)){
                    alert("Please enter a valid phone number");
                    return;
                }
                if(age <= 0){
                    alert("Please enter a valid age");
                    return;
                }
                // Additional validations can be added here if needed

                alert("Login successful");
                window.location.href = "welcome.html";
            }
        </script>
    </body>
</html>
