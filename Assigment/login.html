<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Job Application Login</title>
        <style>
            body {
                font-family: 'Arial', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                color: #333;
            }
            .container {
                background: white;
                border-radius: 10px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
                padding: 40px;
                width: 100%;
                max-width: 400px;
                text-align: center;
            }
            h1 {
                margin-bottom: 30px;
                color: #333;
                font-size: 2em;
            }
            form {
                display: flex;
                flex-direction: column;
            }
            label {
                margin-bottom: 5px;
                font-weight: bold;
                text-align: left;
            }
            input[type="text"], input[type="password"] {
                padding: 12px;
                margin-bottom: 20px;
                border: 1px solid #ddd;
                border-radius: 5px;
                font-size: 16px;
                transition: border-color 0.3s;
            }
            input[type="text"]:focus, input[type="password"]:focus {
                border-color: #667eea;
                outline: none;
            }
            input[type="submit"] {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                padding: 15px;
                border-radius: 5px;
                font-size: 18px;
                cursor: pointer;
                transition: background 0.3s;
            }
            input[type="submit"]:hover {
                background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Job Application Login</h1>
            <form onsubmit="myfunc(event)">
                <label for="name">Full Name:</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
                <label for="email">Email:</label>
                <input type="text" id="email" placeholder="Enter your email" required>
                <label for="pass">Password:</label>
                <input type="password" id="pass" placeholder="Enter your password" required>
                <input type="submit" value="Login">
            </form>
        </div>
        <script>
            function myfunc(e){
                e.preventDefault();
                let name = document.getElementById("name").value;
                let email = document.getElementById("email").value;
                let pass = document.getElementById("pass").value;
                console.log(`username = ${name} email = ${email} password = ${pass}`);
                document.getElementById("name").value = "";
                document.getElementById("email").value = "";
                document.getElementById("pass").value = "";
                if(email === "" || pass === ""){
                    alert("Please fill alldetails");
                    return;
                } else {
                    alert("Login successful");
                    window.location.href = "welcome.html";
                }
            }
        </script>
    </body>
</html>
