<!DOCTYPE html>
<html>
    <head>
        <title>This is test day 5</title>
        <style>
            form {
                margin-top: 50px;
                margin-left: 650px;
                margin-right: 650px;
                padding: 20px;
                border-radius: 10px;
                background-color: #f2f2f2;
                box-shadow: 5px 5px 5px 5px grey;
                background-color: red;
            }
            label {
                box-shadow: 5px 2px 5px rgb(66, 55, 55);
                display: inline-block;
                background-color: bisque;
                width: 150px;    
                margin-bottom: 10px;
            }
            input[type="text"], input[type="password"] {
                width: calc(100% - 160px);
                padding: 5px;
                margin-bottom: 10px;
                border: 1px solid #bd1b1b;
                border-radius: 5px;
            }
            input[type="submit"]{
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 7px;
                border-color: cornsilk;
                cursor: pointer;
                font-size: 30px;
                box-shadow: 3px 5px 5px 5px grey;
            }
            label{
                font-weight: bold;
                color:black;    
            }
            h1{
                color: black;
            }
        </style>
    </head>
    <body>
        <h1 style="background-color: antiquewhite;box-shadow: 5px 7px 7px grey;margin-left: 700px;margin-right: 700px;text-align: center;">JOB APPLICATION AUTH</h1>
        <form onsubmit="myfunc(event)">
            <label for="name">Name : </label>
            <input type="text" id="name"><br><br>
            <label for="email">Email : </label>
            <input type="text" id="email"><br><br>
            <label for="phone">Phone : </label>
            <input type="text" id="phone"><br><br>
            <label for="pass">Password : </label>
            <input type="password" id="pass"><br><br>
            <label for="confpass">Conform Password : </label>
            <input type="password" id="confpass"><br><br>
            <input type="submit">
        </form>
        <script>
            function myfunc(e){
                e.preventDefault();
                let name = document.getElementById("name").value;
                let email = document.getElementById("email").value;
                let phone = document.getElementById("phone").value;
                let password = document.getElementById("pass").value;
                let confpass = document.getElementById("confpass").value;
                console.log(`Name: ${name}, Email: ${email}, Phone: ${phone}, Password: ${password}, Conform Password: ${confpass}`);
                if(name === "" || email === "" || phone === "" || password === "" || confpass === ""){
                    alert("All fields must be filled out");
                    return;
                }
                if(password !== confpass){
                    alert("Passwords do not match");
                    return;
                }
                if(phone.length !== 10 ){
                    alert("Phone number must be 10 digits");
                    return;
                }
                document.getElementById("name").value = "";
                document.getElementById("email").value = "";
                document.getElementById("phone").value = "";
                document.getElementById("pass").value = "";
                document.getElementById("confpass").value = "";
                alert("Form submitted successfully!");
            }
        </script>
    </body>
</html>
